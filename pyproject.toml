[project]
name = "automatic-annotations"
version = "0.1.0"
description = "Local, schema-driven automatic annotation application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "datasets>=3.0",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "networkx>=3.3",
  "numpy>=1.26",
  "pandas>=2.2",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "streamlit>=1.39",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["automatic_annotations"]
